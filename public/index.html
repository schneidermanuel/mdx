<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDX — Markdown to PDF</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
</head>
<body>
<header class="toolbar">
  <h1>MDX</h1>
  <div class="actions">
    <label class="btn" for="md-upload">Open .md</label>
    <input id="md-upload" type="file" accept=".md,.markdown,text/markdown" hidden>
    <button id="download-md" class="btn">Download .md</button>
    <label class="btn" for="image-upload">Insert Image</label>
    <input id="image-upload" type="file" accept="image/*" hidden>
    <button id="export-pdf" class="btn primary">Export PDF</button>
  </div>
</header>

<main class="workspace">
  <section class="pane editor-pane">
    <textarea id="editor" spellcheck="false" aria-label="Markdown source"></textarea>
  </section>
  <div class="divider" id="divider"></div>
  <section class="pane preview-pane">
    <div id="preview" class="markdown-body"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script src="js/plantuml.js"></script>
<script src="js/app.js"></script>
</body>
</html>
